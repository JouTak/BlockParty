name: '$NAME'
version: '$VERSION'
api-version: '$MINECRAFT_VERSION'
main: ru.joutak.blockparty.BlockPartyPlugin
description: "Плагин для проведения мини-игры BlockParty (кто бы мог подумать)"
authors: [ "s4dnex" ]
website: https://joutak.ru

depend: [ 'Multiverse-Core' ]
libraries:
  - "org.jetbrains.kotlin:kotlin-stdlib:$KOTLIN_VERSION"
  - "com.sksamuel.hoplite:hoplite-core:$HOPLITE_VERSION"
  - "com.sksamuel.hoplite:hoplite-yaml:$HOPLITE_VERSION"
  - "com.sksamuel.hoplite:hoplite-watch:$HOPLITE_VERSION"

commands:
  bp:
    description: Команды BlockParty

permissions:
  blockparty.admin:
    default: op
    description: Доступ ко всем командам плагина BlockParty
    children:
      mv.bypass.gamemode.*: true
  blockparty.spectator:
    default: op
    description: Доступ к команде /bp spectate для наблюдения за играми
    children:
      mv.bypass.gamemode.*: true
      minecraft.command.spectate: true